services:
    traefik:
        image: traefik:v3.1
        container_name: traefik
        restart: always
        ports:
            - "8090:8090"
        volumes:
            - "/var/run/docker.sock:/var/run/docker.sock:ro"
        command:
            - --ping=true
            - --providers.docker=true
            - --providers.docker.exposedbydefault=false
            - --entrypoints.web.address=:8090
        # - --experimental.plugins.rewrite-body.modulename=github.com/packruler/rewrite-body
        # - --experimental.plugins.rewrite-body.version=v1.2.0
        # - --experimental.plugins.rewriteHeaders.modulename=github.com/XciD/traefik-plugin-rewrite-headers
        # - --experimental.plugins.rewriteHeaders.version=v0.0.3

    influxdb:
        image: influxdb:1.8
        container_name: influxdb
        hostname: influxdb
        restart: unless-stopped
        volumes:
            - type: bind
              source: ./influxdb.conf
              target: /etc/influxdb/influxdb.conf
              read_only: true
            - type: bind
              source: ./influxdb
              target: /var/lib/influxdb
        ports:
            - "${INFLUXDB_PORTS:-8086:8086}"
        env_file:
            - influxdb.env

    power-flow:
        image: mccahan/power-flow:latest
        container_name: power-flow
        environment:
            - SOLAR_ONLY=false
            - DISABLE_BRANDING=true
            - PYPOWERWALL_URL=/pypowerwall
            - URL_PREFIX=/power-flow/
        ports:
            - 3000:3000
        labels:
            - traefik.enable=true
            - traefik.http.routers.flow.rule=(PathPrefix(`/power-flow`))
            - traefik.http.routers.flow.middlewares=flow-stripprefix
            - traefik.http.middlewares.flow-stripprefix.stripprefix.prefixes=/power-flow
            - traefik.http.services.flow.loadbalancer.server.port=3000
            - traefik.http.routers.flow-assets.rule=(PathPrefix(`/_next`))
            - traefik.http.routers.flow-assets.service=flow

    pypowerwall:
        image: jasonacox/pypowerwall:0.12.4t68
        container_name: pypowerwall
        hostname: pypowerwall
        restart: unless-stopped
        volumes:
            - type: bind
              source: .auth
              target: /app/.auth
        user: "${PWD_USER:-1000:1000}"
        ports:
            - "${PYPOWERWALL_PORTS:-8675:8675}"
        environment:
            - PW_AUTH_PATH=.auth
        env_file:
            - pypowerwall.env
        labels:
            - traefik.enable=true
            - traefik.http.routers.pypowerwall.rule=(PathPrefix(`/pypowerwall`))
            - traefik.http.routers.pypowerwall.middlewares=pypowerwall-stripprefix
            - traefik.http.middlewares.pypowerwall-stripprefix.stripprefix.prefixes=/pypowerwall
            - traefik.http.services.pypowerwall.loadbalancer.server.port=8675
            - custom.label=pypowerwall

    telegraf:
        image: telegraf:1.28.2
        container_name: telegraf
        hostname: telegraf
        restart: unless-stopped
        user: "${PWD_USER:-1000:1000}"
        command: [
            "telegraf",
            "--config",
            "/etc/telegraf/telegraf.conf",
            "--config-directory",
            "/etc/telegraf/telegraf.d"
        ]
        volumes:
            - type: bind
              source: ./telegraf.conf
              target: /etc/telegraf/telegraf.conf
              read_only: true
            - type: bind
              source: ./telegraf.local
              target: /etc/telegraf/telegraf.d/local.conf
              read_only: true
            - type: bind
              source: ./VERSION
              target: /etc/telegraf/VERSION
              read_only: true
            - type: bind
              source: ./ver.sh
              target: /etc/telegraf/ver.sh
              read_only: true
        depends_on:
            - influxdb
            - pypowerwall

    grafana:
        image: grafana/grafana:9.1.2-ubuntu
        container_name: grafana
        hostname: grafana
        restart: unless-stopped
        user: "${PWD_USER:-1000:1000}"
        volumes:
            - type: bind
              source: ./grafana
              target: /var/lib/grafana
        ports:
            - "${GRAFANA_PORTS:-9000:9000}"
        env_file:
            - grafana.env
        depends_on:
            - influxdb
        labels:
            - traefik.enable=true
            - traefik.http.routers.grafana.rule=(PathPrefix(`/`))
            - traefik.http.services.grafana.loadbalancer.server.port=9000
            - custom.label=grafana

    weather411:
        image: jasonacox/weather411:0.2.3
        container_name: weather411
        hostname: weather411
        restart: unless-stopped
        user: "${PWD_USER:-1000:1000}"
        volumes:
            - type: bind
              source: ./weather
              target: /var/lib/weather
              read_only: true
        ports:
            - "${WEATHER411_PORTS:-8676:8676}"
        environment:
            - WEATHERCONF=/var/lib/weather/weather411.conf
        depends_on:
            - influxdb
